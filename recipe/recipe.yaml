schema_version: 1

context:
  name: uptrace
  version: "1.45.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/uptrace-${{ version }}.tar.gz
  sha256: 3e31c4b77a94c7664abbc5d9d144cc910c37468e4b1ff30fb7318b5340af97fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.45.0,<1.46.dev0
    - opentelemetry-sdk >=1.45.0,<1.46.dev0
    - opentelemetry-exporter-otlp >=1.45.0,<1.46.dev0
    - opentelemetry-instrumentation >=0.66b0,<1.dev0
    - opentelemetry-instrumentation-logging >=0.66b0,<1.dev0

tests:
  - python:
      imports:
        - uptrace
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: OpenTelemetry Python distribution for Uptrace
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://uptrace.dev

extra:
  recipe-maintainers:
    - timkpaine
